name: Build Glass ONN APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded source
        run: |
          unzip -o -q GlassONN-v0.5.5-Download.zip
          test -f settings.gradle
          sed -i 's/places\[getPlace()\]/places[MainActivity.this.getPlace()]/g' app/src/main/java/com/glassonn/home/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassONN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

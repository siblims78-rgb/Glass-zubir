name: Build Glass ONN APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked source
        shell: bash
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/glassonn/home/MainActivity.java
          echo "Building directly from tracked Android source (no ZIP extraction)."
      - name: Verify bundled Zen audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/assets/nature")
          for filename in ["zen_clear.ogg", "zen_cloud.ogg", "zen_rain.ogg", "zen_storm.ogg"]:
              p=root/filename
              assert p.is_file(), "Missing "+str(p)
              with p.open("rb") as handle:
                  assert handle.read(4)==b"OggS", "Invalid OGG "+str(p)
              assert 5000<p.stat().st_size<1800000, "Unexpected size "+str(p)
              print("Verified", filename, p.stat().st_size, "bytes")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassONN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Build Glass ONN APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - '.github/workflows/build-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tracked source
        shell: bash
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/java/com/glassonn/home/MainActivity.java
          echo "Building directly from tracked Android source (no ZIP extraction)."
      - name: Balance weather sound cues for this APK
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          bash scripts/prepare-zen-audio.sh
      - name: Verify bundled Zen audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/assets/nature")
          for filename in ["zen_clear.ogg", "zen_cloud.ogg", "zen_rain.ogg", "zen_storm.ogg"]:
              p=root/filename
              assert p.is_file(), "Missing "+str(p)
              with p.open("rb") as handle:
                  assert handle.read(4)==b"OggS", "Invalid OGG "+str(p)
              assert 5000<p.stat().st_size<1800000, "Unexpected size "+str(p)
              print("Verified", filename, p.stat().st_size, "bytes")
          PY
      - name: Validate TV and Companion JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          import re, pathlib, tempfile, subprocess
          paths = ["app/src/main/assets/index.html", "app/src/main/assets/companion.html"]
          for path in paths:
              html = pathlib.Path(path).read_text(encoding="utf-8")
              scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, re.I|re.S)
              assert scripts, f"No script blocks in {path}"
              count = 0
              for attrs,source in scripts:
                  if re.search(r'\bsrc\s*=', attrs, re.I) or not source.strip():
                      continue
                  with tempfile.NamedTemporaryFile(suffix=".js",mode="w",delete=False,encoding="utf-8") as f:
                      f.write(source)
                      name=f.name
                  subprocess.run(["node","--check",name],check=True)
                  pathlib.Path(name).unlink()
                  count += 1
              assert count, f"No inline JavaScript validated in {path}"
              print(f"Validated {count} scripts in {path}")
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        env:
          GLASSONN_TRAKT_CLIENT_ID: ${{ secrets.GLASSONN_TRAKT_CLIENT_ID }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify built APK identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -F "name='com.glassonn.home.v070'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "versionName='0.7.2'" "$RUNNER_TEMP/apk-badging.txt"
          grep -F "application-label:'Glass ONN v0.7.2'" "$RUNNER_TEMP/apk-badging.txt"
      - name: Verify Home launcher registration
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/android-manifest-tree.txt"
          grep -F 'android.intent.category.HOME' "$RUNNER_TEMP/android-manifest-tree.txt"
          grep -F 'android.intent.category.DEFAULT' "$RUNNER_TEMP/android-manifest-tree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: GlassONN-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
